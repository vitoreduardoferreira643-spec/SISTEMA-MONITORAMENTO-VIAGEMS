<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Torre de Controle | Monitoramento de Viagens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<!-- SheetJS: le arquivos .xlsx direto no navegador, sem precisar de backend -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#0c141d; --bg-elevated:#141f2b; --bg-elevated-2:#192734; --bg-hover:#1e2e3c;
  --border:#223140; --border-soft:#1a2733;
  --text-primary:#e7eef4; --text-secondary:#90a7ba; --text-muted:#5f7686;
  --accent-cyan:#33d6c6; --accent-cyan-dim:rgba(51,214,198,.14);
  --accent-amber:#f2a93b; --accent-amber-dim:rgba(242,169,59,.14);
  --accent-red:#ef5a72; --accent-red-dim:rgba(239,90,114,.14);
  --accent-green:#3ed598; --accent-green-dim:rgba(62,213,152,.14);
  --accent-blue:#5b8def; --accent-blue-dim:rgba(91,141,239,.14);
  --font-display:'Space Grotesk','IBM Plex Sans',sans-serif;
  --font-body:'IBM Plex Sans',sans-serif;
  --font-mono:'IBM Plex Mono','Courier New',monospace;
  --radius:10px; --radius-sm:6px;
  --shadow-panel:0 1px 0 rgba(255,255,255,.02) inset, 0 8px 24px rgba(0,0,0,.28);
}
*{box-sizing:border-box}
html,body,#root{height:100%}
body{margin:0;background:var(--bg);color:var(--text-primary);font-family:var(--font-body);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;letter-spacing:-.01em}
button,input,select,textarea{font-family:inherit;color:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px}

.app-shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.sidebar{background:var(--bg-elevated);border-right:1px solid var(--border-soft);padding:22px 16px;display:flex;flex-direction:column;gap:6px}
.sidebar-brand{display:flex;align-items:center;gap:10px;padding:4px 8px 20px}
.sidebar-brand .dot{width:10px;height:10px;border-radius:50%;background:var(--accent-cyan);box-shadow:0 0 0 4px var(--accent-cyan-dim);flex-shrink:0}
.sidebar-brand-text{font-family:var(--font-display);font-weight:700;font-size:14.5px;line-height:1.25}
.sidebar-brand-text span{display:block;font-family:var(--font-mono);font-weight:400;font-size:10.5px;color:var(--text-muted);letter-spacing:.06em;text-transform:uppercase}
.nav-link{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--radius-sm);color:var(--text-secondary);text-decoration:none;font-size:13.5px;font-weight:500;cursor:pointer;transition:background .12s,color .12s}
.nav-link:hover{background:var(--bg-hover);color:var(--text-primary)}
.nav-link.active{background:var(--accent-cyan-dim);color:var(--accent-cyan)}
.sidebar-footer{margin-top:auto;padding:10px 8px 0;border-top:1px solid var(--border-soft);font-size:11.5px;color:var(--text-muted);line-height:1.6}
.main-area{display:flex;flex-direction:column;min-width:0}
.topbar{height:60px;border-bottom:1px solid var(--border-soft);display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:rgba(12,20,29,.7);backdrop-filter:blur(6px);position:sticky;top:0;z-index:10}
.topbar-title{font-size:15px;font-weight:600}
.topbar-meta{font-size:12.5px;color:var(--text-secondary)}
.content{padding:28px;flex:1}

.card{background:var(--bg-elevated);border:1px solid var(--border-soft);border-radius:var(--radius);box-shadow:var(--shadow-panel)}
.card-header{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--border-soft)}
.card-header h3{font-size:14px;font-weight:600}
.card-body{padding:18px}

.kpi-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:22px}
@media (max-width:1100px){.kpi-grid{grid-template-columns:repeat(2,1fr)}}
.kpi-card{background:var(--bg-elevated);border:1px solid var(--border-soft);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow-panel)}
.kpi-label{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);font-weight:600}
.kpi-value{font-family:var(--font-mono);font-size:28px;font-weight:600;margin-top:6px}
.kpi-value.cyan{color:var(--accent-cyan)} .kpi-value.amber{color:var(--accent-amber)}
.kpi-value.green{color:var(--accent-green)} .kpi-value.red{color:var(--accent-red)} .kpi-value.blue{color:var(--accent-blue)}

.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);font-weight:600;padding:10px 14px;border-bottom:1px solid var(--border);white-space:nowrap}
tbody td{padding:12px 14px;border-bottom:1px solid var(--border-soft);vertical-align:middle}
tbody tr{transition:background .12s}
tbody tr.clickable:hover{background:var(--bg-hover);cursor:pointer}
.mono{font-family:var(--font-mono);font-size:12.5px;color:var(--text-secondary)}

.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:11.5px;font-weight:600;letter-spacing:.02em;white-space:nowrap}
.badge .bdot{width:6px;height:6px;border-radius:50%}
.badge.cyan{background:var(--accent-cyan-dim);color:var(--accent-cyan)} .badge.cyan .bdot{background:var(--accent-cyan)}
.badge.amber{background:var(--accent-amber-dim);color:var(--accent-amber)} .badge.amber .bdot{background:var(--accent-amber)}
.badge.red{background:var(--accent-red-dim);color:var(--accent-red)} .badge.red .bdot{background:var(--accent-red)}
.badge.green{background:var(--accent-green-dim);color:var(--accent-green)} .badge.green .bdot{background:var(--accent-green)}
.badge.blue{background:var(--accent-blue-dim);color:var(--accent-blue)} .badge.blue .bdot{background:var(--accent-blue)}
.badge.gray{background:rgba(144,164,183,.14);color:var(--text-secondary)} .badge.gray .bdot{background:var(--text-secondary)}

.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;border:1px solid var(--border);background:var(--bg-elevated-2);color:var(--text-primary);cursor:pointer;transition:all .12s}
.btn:hover{background:var(--bg-hover);border-color:var(--accent-cyan)}
.btn.primary{background:var(--accent-cyan);border-color:var(--accent-cyan);color:#06231f}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{background:transparent;border-color:var(--accent-red);color:var(--accent-red)}
.btn.danger:hover{background:var(--accent-red-dim)}
.btn.sm{padding:6px 12px;font-size:12px}

.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field.full{grid-column:1/-1}
.field label{font-size:12px;font-weight:600;color:var(--text-secondary)}
.field input,.field select,.field textarea{background:var(--bg-elevated-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 12px;font-size:13.5px;outline:none;transition:border-color .12s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent-cyan)}
.field textarea{resize:vertical;min-height:70px}

.modal-overlay{position:fixed;inset:0;background:rgba(6,10,15,.65);display:flex;align-items:flex-start;justify-content:center;padding:60px 20px;z-index:100;overflow-y:auto}
.modal{background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius);width:100%;max-width:620px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--border-soft)}
.modal-body{padding:20px}
.modal-footer{display:flex;justify-content:flex-end;gap:10px;padding:16px 20px;border-top:1px solid var(--border-soft)}
.icon-btn{background:transparent;border:none;color:var(--text-muted);cursor:pointer;font-size:18px;line-height:1}
.icon-btn:hover{color:var(--text-primary)}

.timeline{position:relative;padding-left:26px}
.timeline::before{content:'';position:absolute;left:6px;top:4px;bottom:4px;width:1px;background:var(--border)}
.timeline-item{position:relative;padding-bottom:22px}
.timeline-item:last-child{padding-bottom:0}
.timeline-item::before{content:'';position:absolute;left:-26px;top:3px;width:11px;height:11px;border-radius:50%;background:var(--bg-elevated);border:2px solid var(--accent-cyan)}
.timeline-item.alerta::before{border-color:var(--accent-red)}
.timeline-item.parada::before{border-color:var(--accent-amber)}
.timeline-item.fim::before{border-color:var(--accent-green);box-shadow:0 0 0 4px var(--accent-green-dim)}
.timeline-item.atual::before{border-color:var(--accent-cyan);box-shadow:0 0 0 4px var(--accent-cyan-dim);animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 4px var(--accent-cyan-dim)}50%{box-shadow:0 0 0 8px transparent}}
.timeline-time{font-family:var(--font-mono);font-size:11.5px;color:var(--text-muted)}
.timeline-desc{font-size:13.5px;margin-top:2px}
.timeline-user{font-size:11.5px;color:var(--text-muted);margin-top:3px}

.empty-state{text-align:center;padding:40px 20px;color:var(--text-muted);font-size:13px}
.section-title-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px}
.text-muted{color:var(--text-muted)} .text-secondary{color:var(--text-secondary)}
.grid-2{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;align-items:start}
.error-box{background:var(--accent-red-dim);color:var(--accent-red);border-radius:var(--radius-sm);padding:9px 12px;font-size:12.5px;margin-bottom:14px}
.banner-demo{background:var(--accent-amber-dim);color:var(--accent-amber);border-radius:var(--radius-sm);padding:10px 14px;font-size:12.5px;margin-bottom:20px}
.filters{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.import-row-erro td{opacity:.55}
.import-summary{display:flex;gap:18px;margin-bottom:14px;font-size:12.5px}
.import-summary b{font-family:var(--font-mono)}
.dropzone{border:1px dashed var(--border);border-radius:var(--radius-sm);padding:22px;text-align:center;font-size:13px;color:var(--text-secondary);cursor:pointer;transition:border-color .12s,background .12s}
.dropzone:hover{border-color:var(--accent-cyan);background:var(--bg-elevated-2)}
.dropzone.dragover{border-color:var(--accent-cyan);background:var(--accent-cyan-dim)}

@media (max-width:980px){
  .app-shell{grid-template-columns:1fr}
  .sidebar{display:none}
  .grid-2{grid-template-columns:1fr}
  .form-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="root"></div>

<script>
/* =====================================================================
   Torre de Controle — versao 100% front-end (sem backend)
   Todos os dados vivem em memoria (objeto `state`) e sao perdidos ao
   recarregar a pagina. E uma demonstracao visual/funcional completa,
   pronta para publicar em GitHub Pages sem precisar de servidor.
   ===================================================================== */

let nextId = 100;
function uid(){ return nextId++; }

function agora(offsetHoras){
  const d = new Date();
  d.setHours(d.getHours() + (offsetHoras||0));
  return d;
}

const state = {
  motoristas: [
    { id: 1, nome:'Carlos Eduardo Silva', cpf:'111.222.333-44', cnh:'01234567890', categoriaCnh:'E', telefone:'(11) 98888-1111', email:'carlos.silva@transportadora.com', ativo:true },
    { id: 2, nome:'Maria Aparecida Souza', cpf:'222.333.444-55', cnh:'02345678901', categoriaCnh:'E', telefone:'(11) 98888-2222', email:'maria.souza@transportadora.com', ativo:true },
    { id: 3, nome:'Jose Roberto Lima', cpf:'333.444.555-66', cnh:'03456789012', categoriaCnh:'D', telefone:'(11) 98888-3333', email:'jose.lima@transportadora.com', ativo:true },
  ],
  veiculos: [
    { id: 1, placa:'ABC1D23', modelo:'Volvo FH 540', tipo:'Cavalo Mecanico', cor:'Branco', anoFabricacao:2022, ativo:true },
    { id: 2, placa:'DEF4E56', modelo:'Scania R450', tipo:'Cavalo Mecanico', cor:'Azul', anoFabricacao:2021, ativo:true },
    { id: 3, placa:'GHI7F89', modelo:'Mercedes Actros', tipo:'Truck', cor:'Prata', anoFabricacao:2023, ativo:true },
  ],
  viagens: [],
};

function seedViagens(){
  const v1 = {
    id: uid(), codigoViagem:'VG-2026-000001', origem:'Sao Paulo - SP', destino:'Rio de Janeiro - RJ',
    dataPrevistaSaida: agora(-3), cliente:'Distribuidora Nacional Ltda', carga:'Eletronicos', valorCarga:250000,
    status:'EM_ANDAMENTO', motoristaId:1, veiculoId:1, atualizadoEm: agora(0),
    sm: { numeroSm:'SM-2026-000001', status:'EM_MONITORAMENTO', tipoMonitoramento:'RASTREAMENTO_SATELITAL', operadorResponsavel:'operador', observacoes:'Carga de alto valor - monitoramento reforcado', dataAbertura: agora(-3) },
    paradas: [],
    eventos: [
      { tipo:'VIAGEM_CRIADA', descricao:'Viagem criada: Sao Paulo - SP -> Rio de Janeiro - RJ', usuario:'sistema', dataHora: agora(-3) },
      { tipo:'SM_ABERTA', descricao:'SM SM-2026-000001 aberta (RASTREAMENTO_SATELITAL)', usuario:'operador', dataHora: agora(-3) },
      { tipo:'INICIO_VIAGEM', descricao:'Viagem iniciada', usuario:'operador', dataHora: agora(-3) },
    ],
  };

  const v2 = {
    id: uid(), codigoViagem:'VG-2026-000002', origem:'Campinas - SP', destino:'Belo Horizonte - MG',
    dataPrevistaSaida: agora(-6), cliente:'Industria Alimenticia Bom Sabor', carga:'Alimentos refrigerados', valorCarga:80000,
    status:'PARADA', motoristaId:2, veiculoId:2, atualizadoEm: agora(0),
    sm: { numeroSm:'SM-2026-000002', status:'EM_MONITORAMENTO', tipoMonitoramento:'ESCOLTA_MISTA', operadorResponsavel:'operador', observacoes:'Carga perecivel, atencao ao tempo de parada', dataAbertura: agora(-6) },
    paradas: [
      { id: uid(), local:'Posto BR - Km 120 Via Dutra', motivo:'Parada para descanso do motorista', observacoes:'Dentro da janela autorizada', autorizada:true, dataHoraInicio: agora(-0.7), dataHoraFim:null },
    ],
    eventos: [
      { tipo:'VIAGEM_CRIADA', descricao:'Viagem criada: Campinas - SP -> Belo Horizonte - MG', usuario:'sistema', dataHora: agora(-6) },
      { tipo:'SM_ABERTA', descricao:'SM SM-2026-000002 aberta (ESCOLTA_MISTA)', usuario:'operador', dataHora: agora(-6) },
      { tipo:'INICIO_VIAGEM', descricao:'Viagem iniciada', usuario:'operador', dataHora: agora(-6) },
      { tipo:'PARADA_REGISTRADA', descricao:'Parada em Posto BR - Km 120 Via Dutra - motivo: Parada para descanso do motorista', usuario:'operador', dataHora: agora(-0.7) },
    ],
  };

  const v3 = {
    id: uid(), codigoViagem:'VG-2026-000003', origem:'Santos - SP', destino:'Curitiba - PR',
    dataPrevistaSaida: agora(2), cliente:'Exportadora Sul Atlantico', carga:'Container de graos', valorCarga:420000,
    status:'AGUARDANDO_INICIO', motoristaId:3, veiculoId:3, atualizadoEm: agora(0),
    sm: null, paradas: [],
    eventos: [
      { tipo:'VIAGEM_CRIADA', descricao:'Viagem criada: Santos - SP -> Curitiba - PR', usuario:'sistema', dataHora: agora(0) },
    ],
  };

  state.viagens.push(v1, v2, v3);
}
seedViagens();

/* ---------------- helpers de dominio ---------------- */

const STATUS_VIAGEM_INFO = {
  AGUARDANDO_INICIO:{label:'Aguardando inicio', color:'blue'},
  EM_ANDAMENTO:{label:'Em andamento', color:'cyan'},
  PARADA:{label:'Parada', color:'amber'},
  FINALIZADA:{label:'Finalizada', color:'green'},
  CANCELADA:{label:'Cancelada', color:'red'},
};
const STATUS_SM_INFO = {
  ABERTA:{label:'Aberta', color:'blue'},
  EM_MONITORAMENTO:{label:'Em monitoramento', color:'cyan'},
  ENCERRADA:{label:'Encerrada', color:'green'},
  CANCELADA:{label:'Cancelada', color:'red'},
};
const TIPOS_MONITORAMENTO = [
  ['RASTREAMENTO_SATELITAL','Rastreamento satelital'],
  ['RASTREAMENTO_CELULAR','Rastreamento celular'],
  ['ESCOLTA_ARMADA','Escolta armada'],
  ['ESCOLTA_MISTA','Escolta mista'],
  ['MONITORAMENTO_MANUAL','Monitoramento manual'],
];

function badgeViagem(status){
  const i = STATUS_VIAGEM_INFO[status] || {label:status,color:'gray'};
  return `<span class="badge ${i.color}"><span class="bdot"></span>${i.label}</span>`;
}
function badgeSm(status){
  const i = STATUS_SM_INFO[status] || {label:status,color:'gray'};
  return `<span class="badge ${i.color}"><span class="bdot"></span>${i.label}</span>`;
}
function fmtDT(d){
  if(!d) return '—';
  const dt = (d instanceof Date) ? d : new Date(d);
  return dt.toLocaleString('pt-BR', {day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
}
function fmtT(d){
  if(!d) return '—';
  const dt = (d instanceof Date) ? d : new Date(d);
  return dt.toLocaleTimeString('pt-BR', {hour:'2-digit',minute:'2-digit'});
}
function motoristaNome(id){ const m = state.motoristas.find(x=>x.id===id); return m ? m.nome : '—'; }
function veiculoPlaca(id){ const v = state.veiculos.find(x=>x.id===id); return v ? v.placa : '—'; }
function getViagem(id){ return state.viagens.find(v=>v.id===Number(id)); }
function addEvento(viagem, tipo, descricao, usuario){
  viagem.eventos.unshift({ tipo, descricao, usuario: usuario||'sistema', dataHora: new Date() });
  viagem.atualizadoEm = new Date();
}

/* ---------------- roteamento simples por hash ---------------- */

function currentRoute(){
  return location.hash.replace(/^#/, '') || '/';
}

window.addEventListener('hashchange', render);
window.addEventListener('DOMContentLoaded', render);

function navigate(path){ location.hash = path; }

/* ---------------- layout ---------------- */

const NAV_ITEMS = [
  { to:'/', label:'Painel', icon:'&#9678;' },
  { to:'/viagens', label:'Viagens', icon:'&#9922;' },
  { to:'/motoristas', label:'Motoristas', icon:'&#9786;' },
  { to:'/veiculos', label:'Veiculos', icon:'&#9642;' },
];

function layout(contentHtml, activePath, topTitle){
  const navHtml = NAV_ITEMS.map(item => {
    const active = (item.to === '/' ? activePath === '/' : activePath.startsWith(item.to));
    return `<a class="nav-link${active?' active':''}" onclick="navigate('${item.to}')">${item.label}</a>`;
  }).join('');

  return `
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="dot"></div>
        <div class="sidebar-brand-text">Torre de Controle<span>Monitoramento de Viagens</span></div>
      </div>
      ${navHtml}
      <div class="sidebar-footer">
        Modo demonstracao<br>dados em memoria, sem backend
      </div>
    </aside>
    <div class="main-area">
      <header class="topbar">
        <div class="topbar-title">${topTitle}</div>
        <div class="topbar-meta">Acesso livre (demo)</div>
      </header>
      <main class="content">${contentHtml}</main>
    </div>
  </div>`;
}

function render(){
  closeModal(); // evita modal orfao ficar preso no DOM ao navegar entre paginas
  const route = currentRoute();
  let html, title;

  if(route === '/' ) { html = pageDashboard(); title = 'Painel operacional'; activeRender('/', html, title); return; }
  if(route === '/viagens') { html = pageViagens(); title = 'Viagens'; activeRender('/viagens', html, title); return; }
  if(route === '/motoristas') { html = pageMotoristas(); title = 'Motoristas'; activeRender('/motoristas', html, title); return; }
  if(route === '/veiculos') { html = pageVeiculos(); title = 'Veiculos'; activeRender('/veiculos', html, title); return; }
  if(route.startsWith('/viagens/')) {
    const id = route.split('/')[2];
    html = pageViagemDetalhe(id); title = 'Detalhe da viagem'; activeRender(route, html, title); return;
  }
  navigate('/');
}

function activeRender(path, contentHtml, title){
  document.getElementById('root').innerHTML = layout(contentHtml, path, title);
}

function rerender(){ render(); }

/* ---------------- pagina: dashboard ---------------- */

function pageDashboard(){
  const vs = state.viagens;
  const emAndamento = vs.filter(v=>v.status==='EM_ANDAMENTO').length;
  const parada = vs.filter(v=>v.status==='PARADA').length;
  const aguardando = vs.filter(v=>v.status==='AGUARDANDO_INICIO').length;
  const finalizadas = vs.filter(v=>v.status==='FINALIZADA').length;
  const alertas = vs.reduce((acc,v)=> acc + v.paradas.filter(p=>!p.autorizada).length, 0);
  const emAndamentoLista = vs.filter(v=>v.status==='EM_ANDAMENTO'||v.status==='PARADA');
  const finalizadasLista = vs.filter(v=>v.status==='FINALIZADA');

  return `
  <div class="banner-demo">Este e um site 100% estatico, feito para demonstracao: os dados vivem apenas na memoria do navegador e sao reiniciados ao recarregar a pagina.</div>

  <div class="section-title-row">
    <div>

/* ---------------- importacao de planilha (.xlsx) ---------------- */

// Aceita varios nomes de coluna possiveis (sem acento, minusculo, sem espaco/pontuacao).
// A busca e por CONTEUDO (ex: "numerosm" tambem casa com "numerodasm", "smnumero" etc.)
// Inclui os nomes usados no relatorio padrao da torre de controle (Id Sol, Cad. Em, Cad. Por...).
const COLUNAS_IMPORTACAO = {
  numeroSm: ['numerosm','numero','nsm','sm','codigosm','idsolicitacao','solicitacaomonitoramento','solicitacao','numerosolicitacao','codigosolicitacao','idsm','idsol'],
  operador: ['quemcriou','operador','operadorresponsavel','responsavel','criadopor','criador','usuario','solicitante','analista','cadpor'],
  dataHora: ['datahora','data','datadesaida','dataprevista','datahorasaida','datahoralocal','datahorainicio','datacriacao','cadem'],
  origem: ['locala','origem','localdeorigem','origemlocal','de','saida','pontoa','partida'],
  destino: ['localb','destino','localdedestino','destinolocal','para','chegada','pontob'],
  cliente: ['cliente','clientenome','razaosocial'],
  carga: ['carga','descricaocarga','cargatransportada','tipodecarga','mercadoria'],
  valorCarga: ['valor','valorcarga','valordacarga','valornf','valormercadoria','totalentregas'],
  motorista: ['motorista','condutor','nomemotorista'],
  veiculo: ['veiculo','placa','placaveiculo','veiculoplaca'],
  tipoMonitoramento: ['tipomonitoramento','tipo','monitoramento','tipodemonitoramento'],
  situacao: ['situacao','status','statussm','situacaosm','situacaoda'],
  perfilSm: ['perfildasm','perfilsm','perfil'],
  operacaoTipo: ['operacao','tipooperacao','operacaotipo'],
};

function normalizarChave(txt){
  return String(txt||'')
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .toLowerCase().replace(/[^a-z0-9]/g,'');
}

const ORDEM_CAMPOS_IMPORTACAO = ['numeroSm','operador','dataHora','origem','destino','cliente','carga','valorCarga','motorista','veiculo','tipoMonitoramento','situacao','perfilSm','operacaoTipo'];

// Mapeia todos os campos de uma linha de uma vez so. Isso evita que duas colunas
// diferentes "disputem" o mesmo campo: cada coluna da planilha, uma vez usada
// por um campo, e removida do conjunto disponivel e nao pode mais ser reaproveitada
// por outro campo (ex.: "Data de Saida" nao pode virar "Origem" so porque contem "saida").
function mapearLinha(linhaNormalizada){
  const chavesDisponiveis = new Set(
    Object.keys(linhaNormalizada).filter(k => String(linhaNormalizada[k]).trim() !== '')
  );
  const resultado = {};

  // 1a passada: so aceita colunas com nome EXATAMENTE igual a um candidato
  ORDEM_CAMPOS_IMPORTACAO.forEach(function(campo){
    const candidatos = COLUNAS_IMPORTACAO[campo];
    for(const c of candidatos){
      if(chavesDisponiveis.has(c)){
        resultado[campo] = linhaNormalizada[c];
        chavesDisponiveis.delete(c);
        break;
      }
    }
  });

  // 2a passada: para campos ainda sem valor, aceita colunas cujo nome CONTENHA
  // o candidato (ex: cabecalho "Origem (cidade)" casa com o candidato "origem")
  ORDEM_CAMPOS_IMPORTACAO.forEach(function(campo){
    if(resultado[campo] !== undefined) return;
    const candidatos = COLUNAS_IMPORTACAO[campo].filter(c => c.length >= 4);
    for(const c of candidatos){
      const chaveEncontrada = [...chavesDisponiveis].find(k => k.includes(c) || c.includes(k));
      if(chaveEncontrada){
        resultado[campo] = linhaNormalizada[chaveEncontrada];
        chavesDisponiveis.delete(chaveEncontrada);
        break;
      }
    }
  });

  return resultado;
}

// Alguns relatorios trazem "Origem / Destino" numa unica coluna. Detecta esse
// caso ANTES do mapeamento normal e retorna {origem, destino, chaveConsumida}.
function extrairOrigemDestinoCombinado(linhaNormalizada){
  const chave = Object.keys(linhaNormalizada).find(k => k.includes('origem') && k.includes('destino'));
  if(!chave) return null;
  const valor = String(linhaNormalizada[chave] || '');
  const separador = valor.includes('/') ? '/' : (valor.includes(' - ') ? ' - ' : null);
  if(!separador) return { origem: valor.trim(), destino: '', chaveConsumida: chave };
  const partes = valor.split(separador);
  return { origem: (partes[0]||'').trim(), destino: (partes.slice(1).join(separador)||'').trim(), chaveConsumida: chave };
}

function parseDataPlanilha(valor){
  if(valor instanceof Date && !isNaN(valor)) return valor;
  if(typeof valor === 'number'){
    // numero serial de data do Excel
    return new Date(Math.round((valor - 25569) * 86400 * 1000));
  }
  if(typeof valor === 'string' && valor.trim()){
    const txt = valor.trim();
    // formato brasileiro "DD-MM-YYYY HH:MM:SS" ou "DD/MM/YYYY HH:MM:SS" (ex.: relatorios de torre de controle)
    const brMatch = txt.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})[ T](\d{1,2}):(\d{2})(?::(\d{2}))?$/);
    if(brMatch){
      const [, dia, mes, ano, hora, min, seg] = brMatch;
      return new Date(Number(ano), Number(mes) - 1, Number(dia), Number(hora), Number(min), Number(seg || 0));
    }
    // formato brasileiro so com data, sem hora: "DD-MM-YYYY" ou "DD/MM/YYYY"
    const brMatchSoData = txt.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
    if(brMatchSoData){
      const [, dia, mes, ano] = brMatchSoData;
      return new Date(Number(ano), Number(mes) - 1, Number(dia));
    }
    const d = new Date(txt.replace(' ', 'T'));
    if(!isNaN(d)) return d;
  }
  return new Date();
}

// Traduz o valor da coluna "Situacao" do relatorio para o status da viagem e da SM.
// "Aprovada" = operacao normal (viagem em andamento, SM em monitoramento).
// "Inconformidade" = precisa de atencao (viagem marcada como parada + evento de alerta).
function mapearSituacao(valorBruto){
  const norm = normalizarChave(valorBruto);
  if(norm.includes('inconform') || norm.includes('reprov') || norm.includes('pendente')){
    return { statusViagem:'PARADA', statusSm:'EM_MONITORAMENTO', gerarAlerta:true };
  }
  if(norm.includes('cancel')){
    return { statusViagem:'CANCELADA', statusSm:'CANCELADA', gerarAlerta:false };
  }
  if(norm.includes('encerr') || norm.includes('finaliz')){
    return { statusViagem:'FINALIZADA', statusSm:'ENCERRADA', gerarAlerta:false };
  }
  if(norm.includes('aprov') || norm.includes('andamento') || norm.includes('ativ')){
    return { statusViagem:'EM_ANDAMENTO', statusSm:'EM_MONITORAMENTO', gerarAlerta:false };
  }
  return { statusViagem:'AGUARDANDO_INICIO', statusSm:'ABERTA', gerarAlerta:false };
}

// Muitos sistemas legados de torre de controle exportam "planilhas" que na
// verdade sao uma tabela HTML salva com extensao .xls/.xlsx. O Excel abre
// normalmente (ele detecta o conteudo), entao tratamos esse caso aqui tambem,
// sem depender do SheetJS para esse formato especifico.
function pareceHtml(amostraTexto){
  return amostraTexto.trim().toLowerCase().startsWith('<');
}

function extrairLinhasDeHtml(htmlTexto){
  const linhasTr = htmlTexto.match(/<tr[^>]*>([\s\S]*?)<\/tr>/gi) || [];
  if(linhasTr.length === 0) return [];

  function limparCelula(html){
    return html
      .replace(/<[^>]*>/g, ' ')
      .replace(/&nbsp;/gi, ' ')
      .replace(/&amp;/gi, '&')
      .replace(/\s+/g, ' ')
      .trim();
  }

  function extrairCelulas(trHtml, tag){
    const regex = new RegExp('<' + tag + '[^>]*>([\\s\\S]*?)<\\/' + tag + '>', 'gi');
    const celulas = [];
    let m;
    while((m = regex.exec(trHtml)) !== null){
      celulas.push(limparCelula(m[1]));
    }
    return celulas;
  }

  // cabecalho: tenta pegar <th> da primeira linha; se nao tiver, usa <td> dela mesmo
  let cabecalho = extrairCelulas(linhasTr[0], 'th');
  if(cabecalho.length === 0){ cabecalho = extrairCelulas(linhasTr[0], 'td'); }

  const linhas = [];
  for(let i = 1; i < linhasTr.length; i++){
    const celulas = extrairCelulas(linhasTr[i], 'td');
    if(celulas.length === 0) continue;
    const obj = {};
    celulas.forEach(function(valor, idx){
      const chave = cabecalho[idx] || ('Coluna ' + (idx + 1));
      obj[chave] = valor;
    });
    linhas.push(obj);
  }
  return linhas;
}

let importacaoPendente = [];
let cabecalhosDetectados = [];

function processarPlanilha(file){
  if(!file) return;

  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const buffer = e.target.result;
      const amostra = new TextDecoder('utf-8').decode(buffer.slice(0, 1000));
      let linhas;

      if(pareceHtml(amostra)){
        // arquivo "xls" que na verdade e uma tabela HTML (comum em relatorios exportados de sistemas de torre de controle)
        const textoCompleto = new TextDecoder('utf-8').decode(buffer);
        linhas = extrairLinhasDeHtml(textoCompleto);
      } else {
        if(typeof XLSX === 'undefined'){ alert('Nao foi possivel carregar a biblioteca de planilhas. Verifique sua conexao com a internet.'); return; }
        const wb = XLSX.read(new Uint8Array(buffer), { type:'array', cellDates:true });
        const primeiraAba = wb.Sheets[wb.SheetNames[0]];
        linhas = XLSX.utils.sheet_to_json(primeiraAba, { defval:'' });
      }

      if(linhas.length === 0){
        alert('A planilha esta vazia ou nao foi possivel ler nenhuma linha.');
        return;
      }

      // guarda os cabecalhos originais (como estao na planilha) so para exibir no diagnostico
      cabecalhosDetectados = Object.keys(linhas[0]);

      // numeros de SM que ja existem no sistema (de importacoes/cadastros anteriores)
      const numerosSmExistentes = new Set(
        state.viagens.filter(v => v.sm && v.sm.numeroSm).map(v => normalizarChave(v.sm.numeroSm))
      );
      // numeros de SM ja vistos nesta MESMA planilha (evita duplicar dentro do proprio arquivo)
      const numerosSmNestaPlanilha = new Set();

      importacaoPendente = linhas.map(function(linha, idx){
        const linhaNorm = {};
        Object.keys(linha).forEach(function(k){ linhaNorm[normalizarChave(k)] = linha[k]; });

        // Se a planilha tiver uma unica coluna "Origem / Destino", separa antes
        // de mapear o resto, para nao conflitar com os demais campos.
        const combinado = extrairOrigemDestinoCombinado(linhaNorm);
        if(combinado){ delete linhaNorm[combinado.chaveConsumida]; }

        const campos = mapearLinha(linhaNorm);
        const origem = combinado ? combinado.origem : campos.origem;
        const destino = combinado ? combinado.destino : campos.destino;
        const numeroSm = campos.numeroSm;
        const operador = campos.operador;
        const dataHoraRaw = campos.dataHora;
        const cliente = campos.cliente;
        const carga = campos.carga;
        const valorCarga = campos.valorCarga;
        const motoristaNomeTxt = campos.motorista;
        const veiculoPlacaTxt = campos.veiculo;
        const tipoMonRaw = campos.tipoMonitoramento;
        const situacaoRaw = campos.situacao;
        const perfilSmTxt = campos.perfilSm;
        const operacaoTipoTxt = campos.operacaoTipo;

        const situacaoInfo = mapearSituacao(situacaoRaw);

        // origem/destino nao sao obrigatorias: uma linha so e considerada
        // invalida se estiver completamente vazia (nenhum campo relevante preenchido)
        const linhaTemAlgumDado = [origem, destino, numeroSm, operador, cliente, carga, motoristaNomeTxt, veiculoPlacaTxt]
          .some(v => v !== undefined && String(v).trim() !== '');
        const erros = linhaTemAlgumDado ? [] : ['Linha vazia'];

        // duplicidade: mesma SM ja existe no sistema, ou ja apareceu antes nesta mesma planilha
        // (o relatorio e reexportado de hora em hora, entao a maioria das linhas repete)
        const chaveSm = numeroSm ? normalizarChave(numeroSm) : null;
        let duplicada = false;
        let motivoDuplicidade = '';
        if(chaveSm){
          if(numerosSmExistentes.has(chaveSm)){
            duplicada = true;
            motivoDuplicidade = 'SM ja importada anteriormente';
          } else if(numerosSmNestaPlanilha.has(chaveSm)){
            duplicada = true;
            motivoDuplicidade = 'SM repetida nesta mesma planilha';
          } else {
            numerosSmNestaPlanilha.add(chaveSm);
          }
        }

        // observacoes da SM ganham o contexto extra do relatorio (perfil/operacao),
        // que nao tem um campo dedicado no sistema
        const partesObs = [];
        if(perfilSmTxt) partesObs.push('Perfil: ' + String(perfilSmTxt).trim());
        if(operacaoTipoTxt) partesObs.push('Operacao: ' + String(operacaoTipoTxt).trim());
        if(situacaoRaw) partesObs.push('Situacao original: ' + String(situacaoRaw).trim());

        return {
          linhaOriginal: idx + 2, // considerando cabecalho na linha 1
          valido: erros.length === 0,
          erros,
          duplicada,
          motivoDuplicidade,
          numeroSm: numeroSm ? String(numeroSm).trim() : null,
          operador: operador ? String(operador).trim() : 'importacao',
          dataHora: parseDataPlanilha(dataHoraRaw),
          origem: origem ? String(origem).trim() : 'Nao informado',
          destino: destino ? String(destino).trim() : 'Nao informado',
          cliente: cliente ? String(cliente).trim() : '',
          carga: carga ? String(carga).trim() : '',
          valorCarga: valorCarga ? Number(valorCarga) || undefined : undefined,
          motoristaNome: motoristaNomeTxt ? String(motoristaNomeTxt).trim() : '',
          veiculoPlaca: veiculoPlacaTxt ? String(veiculoPlacaTxt).trim().toUpperCase() : '',
          tipoMonitoramento: normalizarTipoMonitoramento(tipoMonRaw),
          statusViagem: situacaoInfo.statusViagem,
          statusSm: situacaoInfo.statusSm,
          gerarAlerta: situacaoInfo.gerarAlerta,
          situacaoOriginal: situacaoRaw ? String(situacaoRaw).trim() : '',
          observacoesSm: partesObs.join(' | '),
        };
      });

      abrirModalPreviewImportacao();
    } catch(err){
      alert('Nao foi possivel ler essa planilha. Verifique se o arquivo e um .xlsx valido.');
    }
  };
  reader.readAsArrayBuffer(file);
}

function normalizarTipoMonitoramento(valorBruto){
  if(!valorBruto) return 'MONITORAMENTO_MANUAL';
  const norm = normalizarChave(valorBruto);
  const encontrado = TIPOS_MONITORAMENTO.find(([codigo, label]) =>
    normalizarChave(codigo) === norm || normalizarChave(label) === norm
  );
  return encontrado ? encontrado[0] : 'MONITORAMENTO_MANUAL';
}

function abrirModalPreviewImportacao(){
  const duplicadas = importacaoPendente.filter(l => l.valido && l.duplicada).length;
  const validas = importacaoPendente.filter(l => l.valido && !l.duplicada).length;
  const invalidas = importacaoPendente.length - validas - duplicadas;

  const linhasHtml = importacaoPendente.map(function(l, i){
    const classe = !l.valido ? 'import-row-erro' : (l.duplicada ? 'import-row-erro' : '');
    let statusHtml;
    if(!l.valido){
      statusHtml = `<span class="badge red" title="${l.erros.join(', ')}"><span class="bdot"></span>Linha vazia</span>`;
    } else if(l.duplicada){
      statusHtml = `<span class="badge gray" title="${l.motivoDuplicidade}"><span class="bdot"></span>Duplicada</span>`;
    } else {
      statusHtml = '<span class="badge green"><span class="bdot"></span>OK</span>';
    }
    return `
    <tr class="${classe}">
      <td class="mono">${l.linhaOriginal}</td>
      <td class="mono">${l.numeroSm || '<em style="color:var(--text-muted)">gerado automaticamente</em>'}</td>
      <td>${l.origem || '—'} &rarr; ${l.destino || '—'}</td>
      <td class="mono">${fmtDT(l.dataHora)}</td>
      <td>${l.operador}</td>
      <td>${l.motoristaNome || '<em style="color:var(--text-muted)">sera criado</em>'}</td>
      <td>${l.veiculoPlaca || '<em style="color:var(--text-muted)">sera criado</em>'}</td>
      <td>${l.situacaoOriginal ? `${l.situacaoOriginal} &rarr; ${badgeViagem(l.statusViagem)}` : badgeViagem(l.statusViagem)}</td>
      <td>${statusHtml}</td>
    </tr>`;
  }).join('');

  openModal('Pre-visualizar importacao', `
    <details style="margin-bottom:14px">
      <summary style="cursor:pointer;font-size:12.5px;color:var(--text-secondary)">Ver colunas detectadas nesta planilha (diagnostico)</summary>
      <div style="margin-top:8px;font-size:12px;color:var(--text-muted);line-height:1.7">
        <b>Cabecalhos encontrados no arquivo:</b> ${cabecalhosDetectados.map(h => `<span class="mono" style="background:var(--bg-elevated-2);padding:1px 6px;border-radius:4px;margin-right:4px">${h}</span>`).join(' ') || '—'}
      </div>
    </details>
    <div class="import-summary">
      <span>Linhas lidas: <b>${importacaoPendente.length}</b></span>
      <span style="color:var(--accent-green)">Novas (serao importadas): <b>${validas}</b></span>
      ${duplicadas > 0 ? `<span class="text-muted">Ja importadas antes: <b>${duplicadas}</b></span>` : ''}
      ${invalidas > 0 ? `<span style="color:var(--accent-red)">Com problema: <b>${invalidas}</b></span>` : ''}
    </div>
    ${duplicadas > 0 ? `<div class="banner-demo">${duplicadas} linha(s) com uma SM que ja foi importada antes (ou repetida na propria planilha) serao ignoradas automaticamente — normal quando o mesmo relatorio e reenviado de hora em hora.</div>` : ''}
    ${invalidas > 0 ? `<div class="error-box">Linhas marcadas em vermelho estao completamente vazias e serao ignoradas na importacao.</div>` : ''}
    <div class="table-wrap" style="max-height:340px;overflow-y:auto">
      <table>
        <thead><tr><th>Linha</th><th>Numero SM</th><th>Rota</th><th>Data/hora</th><th>Criado por</th><th>Motorista</th><th>Veiculo</th><th>Situacao</th><th></th></tr></thead>
        <tbody>${linhasHtml}</tbody>
      </table>
    </div>
    <p class="text-muted" style="font-size:12px;margin-top:12px">
      Motoristas e veiculos informados na planilha que ainda nao existem no cadastro serao criados automaticamente.
      O codigo da viagem sera o proprio numero da SM (Id Sol). Cada linha nova gera uma viagem com a SM ja vinculada.
    </p>`,
    `<button class="btn" onclick="closeModal()">Cancelar</button>
     <button class="btn primary" onclick="confirmarImportacao()" ${validas===0?'disabled':''}>Importar ${validas} viagem(ns) nova(s)</button>`
  );
}

function obterOuCriarMotoristaPorNome(nome){
  if(!nome) return state.motoristas[0] ? state.motoristas[0].id : null;
  const existente = state.motoristas.find(m => normalizarChave(m.nome) === normalizarChave(nome));
  if(existente) return existente.id;
  const novo = { id: uid(), nome, cpf: '(nao informado)', cnh:'', categoriaCnh:'', telefone:'', email:'', ativo:true };
  state.motoristas.push(novo);
  return novo.id;
}

function obterOuCriarVeiculoPorPlaca(placa){
  if(!placa) return state.veiculos[0] ? state.veiculos[0].id : null;
  const existente = state.veiculos.find(v => normalizarChave(v.placa) === normalizarChave(placa));
  if(existente) return existente.id;
  const novo = { id: uid(), placa, modelo:'(nao informado)', tipo:'', cor:'', anoFabricacao:undefined, ativo:true };
  state.veiculos.push(novo);
  return novo.id;
}

function confirmarImportacao(){
  const validas = importacaoPendente.filter(l => l.valido && !l.duplicada);
  let criadas = 0;

  validas.forEach(function(l){
    const motoristaId = obterOuCriarMotoristaPorNome(l.motoristaNome);
    const veiculoId = obterOuCriarVeiculoPorPlaca(l.veiculoPlaca);
    if(!motoristaId || !veiculoId) return; // sem nenhum motorista/veiculo cadastrado no sistema ainda

    const id = uid();
    // O codigo da viagem passa a ser o proprio Id Sol (numero da SM) do relatorio,
    // para a viagem e a SM ficarem sempre com o mesmo identificador visivel.
    // Se a linha nao trouxer numero de SM, gera um codigo VG- como reserva.
    const numeroSm = l.numeroSm || ('SM-' + new Date().getFullYear() + '-' + String(id).padStart(6,'0'));
    const codigo = l.numeroSm ? l.numeroSm : ('VG-' + new Date().getFullYear() + '-' + String(id).padStart(6,'0'));

    const viagem = {
      id, codigoViagem: codigo, origem: l.origem, destino: l.destino,
      dataPrevistaSaida: l.dataHora, cliente: l.cliente, carga: l.carga, valorCarga: l.valorCarga,
      status: l.statusViagem, motoristaId, veiculoId, atualizadoEm: new Date(),
      sm: null, paradas: [], eventos: [],
    };

    addEvento(viagem, 'VIAGEM_CRIADA', `Viagem criada via importacao de planilha: ${l.origem} -> ${l.destino}`, l.operador);

    const obsFinal = ['SM importada via planilha.', l.observacoesSm].filter(Boolean).join(' ');
    viagem.sm = {
      numeroSm, status: l.statusSm, tipoMonitoramento: l.tipoMonitoramento,
      operadorResponsavel: l.operador, observacoes: obsFinal,
      dataAbertura: l.dataHora,
    };
    addEvento(viagem, 'SM_ABERTA', `SM ${numeroSm} aberta via importacao (${l.tipoMonitoramento})`, l.operador);

    if(l.gerarAlerta){
      addEvento(viagem, 'ALERTA', `Situacao importada como "${l.situacaoOriginal}" — verificar viagem`, l.operador);
    }

    state.viagens.push(viagem);
    criadas++;
  });

  importacaoPendente = [];
  closeModal();
  rerender();
  alert(criadas + ' viagem(ns) importada(s) com sucesso, ja com a SM vinculada (codigo da viagem = Id da SM).');
}

function pageViagemDetalhe(id){
  const v = getViagem(id);
  if(!v) return `<div class="empty-state">Viagem nao encontrada.</div>`;

  const acoes = [];
  if(v.status==='AGUARDANDO_INICIO') acoes.push(`<button class="btn primary" onclick="mudarStatus(${v.id},'EM_ANDAMENTO')">Iniciar viagem</button>`);
  if(v.status==='EM_ANDAMENTO' || v.status==='AGUARDANDO_INICIO') acoes.push(`<button class="btn" onclick="abrirModalParada(${v.id})">Registrar parada</button>`);
  if(v.status==='PARADA') acoes.push(`<button class="btn primary" onclick="mudarStatus(${v.id},'EM_ANDAMENTO')">Retomar viagem</button>`);
  if(v.status==='EM_ANDAMENTO'||v.status==='PARADA') acoes.push(`<button class="btn" onclick="mudarStatus(${v.id},'FINALIZADA')">Finalizar viagem</button>`);
  if(v.status!=='FINALIZADA' && v.status!=='CANCELADA') acoes.push(`<button class="btn danger" onclick="mudarStatus(${v.id},'CANCELADA')">Cancelar viagem</button>`);

  const paradasRows = v.paradas.map(p=>`
    <tr>
      <td>${p.local}</td><td>${p.motivo}</td>
      <td class="mono">${fmtT(p.dataHoraInicio)}</td>
      <td class="mono">${p.dataHoraFim?fmtT(p.dataHoraFim):'—'}</td>
      <td><span class="badge ${p.autorizada?'green':'red'}"><span class="bdot"></span>${p.autorizada?'Sim':'Nao'}</span></td>
      <td>${!p.dataHoraFim ? `<button class="btn sm" onclick="encerrarParada(${v.id},${p.id})">Encerrar</button>` : ''}</td>
    </tr>`).join('');

  const eventosHtml = v.eventos.map((ev,idx)=>{
    let cls = '';
    if(ev.tipo==='ALERTA') cls='alerta';
    else if(ev.tipo==='PARADA_REGISTRADA') cls='parada';
    else if(ev.tipo==='FINALIZACAO') cls='fim';
    if(idx===0) cls += ' atual';
    return `<div class="timeline-item ${cls}">
      <div class="timeline-time">${fmtDT(ev.dataHora)}</div>
      <div class="timeline-desc">${ev.descricao}</div>
      ${ev.usuario?`<div class="timeline-user">por ${ev.usuario}</div>`:''}
    </div>`;
  }).join('');

  return `
  <button class="btn sm" onclick="navigate('/viagens')" style="margin-bottom:16px">&larr; Voltar</button>

  <div class="section-title-row">
    <div>
      <h2 style="font-size:18px"><span class="mono">${v.codigoViagem}</span> — ${v.origem} &rarr; ${v.destino}</h2>
      <p class="text-muted" style="font-size:12.5px;margin-top:4px">Cliente: ${v.cliente||'—'} &middot; Carga: ${v.carga||'—'}</p>
    </div>

  </div>

  <div style="display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap">${acoes.join('')}</div>

  <div class="grid-2">
    <div style="display:flex;flex-direction:column;gap:20px">
      <div class="card">
        <div class="card-header">
          <h3>Solicitacao de Monitoramento (SM)</h3>
          ${!v.sm ? `<button class="btn sm primary" onclick="abrirModalSm(${v.id})">Abrir SM</button>` : ''}
        </div>
        <div class="card-body">
          ${v.sm ? `

              <div><b class="mono">${v.sm.numeroSm}</b> ${badgeSm(v.sm.status)}</div>
              <div class="text-secondary">Tipo: ${v.sm.tipoMonitoramento.replaceAll('_',' ')}</div>
              ${v.sm.operadorResponsavel?`<div class="text-secondary">Operador: ${v.sm.operadorResponsavel}</div>`:''}
              ${v.sm.observacoes?`<div class="text-secondary">Obs: ${v.sm.observacoes}</div>`:''}

        </div>

        <div class="timeline">${eventosHtml || `<div class="empty-state">Sem eventos registrados</div>`}</div>
      </div>
    </div>
  </div>`;
}

function mudarStatus(viagemId, novoStatus){
  const v = getViagem(viagemId);
  const anterior = v.status;
  v.status = novoStatus;
  v.atualizadoEm = new Date();

  if(novoStatus==='EM_ANDAMENTO' && anterior==='AGUARDANDO_INICIO'){
    addEvento(v,'INICIO_VIAGEM','Viagem iniciada','operador');
  } else if(novoStatus==='EM_ANDAMENTO' && anterior==='PARADA'){
    addEvento(v,'RETOMADA_VIAGEM','Viagem retomada apos parada','operador');
  } else if(novoStatus==='FINALIZADA'){
    addEvento(v,'FINALIZACAO','Viagem finalizada','operador');
  } else if(novoStatus==='CANCELADA'){
    addEvento(v,'CANCELAMENTO','Viagem cancelada','operador');
  }
  rerender();
}

function salvarSm(e, viagemId){
  e.preventDefault();
  const v = getViagem(viagemId);
  const tipo = document.getElementById('fsm-tipo').value;
  const numero = 'SM-' + new Date().getFullYear() + '-' + String(v.id).padStart(6,'0');
  v.sm = {
    numeroSm: numero, status:'ABERTA', tipoMonitoramento: tipo,
    operadorResponsavel: document.getElementById('fsm-operador').value,
    observacoes: document.getElementById('fsm-obs').value,
    dataAbertura: new Date(),
  };
  addEvento(v, 'SM_ABERTA', `SM ${numero} aberta (${tipo})`, v.sm.operadorResponsavel || 'operador');
  closeModal();
  rerender();
  return false;
}

  );
}

function salvarParada(e, viagemId){
  e.preventDefault();
  const v = getViagem(viagemId);
  const local = document.getElementById('fp-local').value;
  const motivo = document.getElementById('fp-motivo').value;
  const autorizada = document.getElementById('fp-autorizada').value === '1';
  if(!local || !motivo){ alert('Preencha Local e Motivo da parada.'); return false; }

  v.paradas.unshift({ id: uid(), local, motivo, observacoes: document.getElementById('fp-obs').value, autorizada, dataHoraInicio: new Date(), dataHoraFim: null });
  v.status = 'PARADA';
  v.atualizadoEm = new Date();

  addEvento(v, 'PARADA_REGISTRADA', `Parada em ${local} - motivo: ${motivo}${autorizada?'':' [NAO AUTORIZADA]'}`, 'operador');
  if(!autorizada){ addEvento(v, 'ALERTA', `Alerta: parada nao autorizada em ${local}`, 'operador'); }

  closeModal();
  rerender();
  return false;
}

function encerrarParada(viagemId, paradaId){
  const v = getViagem(viagemId);
  const p = v.paradas.find(x=>x.id===paradaId);
  p.dataHoraFim = new Date();
  v.status = 'EM_ANDAMENTO';
  v.atualizadoEm = new Date();
  addEvento(v, 'RETOMADA_VIAGEM', 'Viagem retomada apos parada', 'operador');
  rerender();
}

/* ---------------- modal generico ---------------- */

function openModal(title, bodyHtml, footerHtml){
  // Garante que nunca existam dois modais sobrepostos no DOM (o que fazia o
  // clique em "Registrar/Salvar" ler os campos do modal antigo, vazio,
  // em vez do que estava visivel na tela).
  closeModal();

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'modal-overlay';
  overlay.onclick = (e)=>{ if(e.target===overlay) closeModal(); };
  overlay.innerHTML = `
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-header"><h3>${title}</h3><button class="icon-btn" onclick="closeModal()">&#10005;</button></div>
      <div class="modal-body">${bodyHtml}</div>
      <div class="modal-footer">${footerHtml}</div>
    </div>`;
  document.body.appendChild(overlay);
}
function closeModal(){
  document.querySelectorAll('.modal-overlay').forEach(el => el.remove());
}
</script>
